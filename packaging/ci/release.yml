name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Verify Quality Gates
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Package Linux Archive
        run: |
          mkdir -p dist-pkg
          cp target/release/ytm-shell dist-pkg/
          cp packaging/ytm-shell.desktop dist-pkg/
          cp icons/128x128.png dist-pkg/
          cp dist/install.sh dist-pkg/
          tar -czvf ytm-shell-linux-x86_64.tar.gz -C dist-pkg .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytm-shell-linux-x86_64
          path: ytm-shell-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Package Windows Archive
        shell: bash
        run: |
          mkdir -p dist-win
          cp target/release/ytm-shell.exe dist-win/
          cp icons/icon.ico dist-win/
          compress-archive -Path dist-win/* -DestinationPath ytm-shell-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytm-shell-windows-x64
          path: ytm-shell-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ytm-shell-linux-x86_64

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ytm-shell-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ytm-shell-linux-x86_64.tar.gz
            ytm-shell-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
