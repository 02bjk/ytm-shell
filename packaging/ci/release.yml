name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Verify Quality Gates
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --locked --bin ytm-shell

      - name: Package Linux Archive
        run: |
          mkdir -p dist-pkg
          cp target/release/ytm-shell dist-pkg/
          cp packaging/ytm-shell.desktop dist-pkg/
          cp icons/128x128.png dist-pkg/
          cp dist/install.sh dist-pkg/
          tar -czvf ytm-shell-linux-x86_64.tar.gz -C dist-pkg .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytm-shell-linux-x86_64
          path: ytm-shell-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --locked --bin ytm-shell

      - name: Package Windows Installer & Archive
        shell: bash
        run: |
          mkdir -p dist-win
          cp target/release/ytm-shell.exe dist-win/
          cp icons/icon.ico dist-win/

          # Locate makensis on Windows Runner
          if command -v makensis >/dev/null 2>&1; then
            MAKENSIS="makensis"
          elif [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          elif [ -f "C:\\Program Files (x86)\\NSIS\\makensis.exe" ]; then
            MAKENSIS="C:\\Program Files (x86)\\NSIS\\makensis.exe"
          else
            choco install nsis -y
            MAKENSIS="makensis"
          fi

          (cd packaging/windows && "$MAKENSIS" installer.nsi)

          # Build portable zip for users who prefer portable execution
          powershell -Command "Compress-Archive -Path dist-win/ytm-shell.exe,dist-win/icon.ico -DestinationPath dist-win/ytm-shell-windows-x64-portable.zip -Force"
          cp dist-win/ytm-shell-windows-x64-portable.zip dist-win/ytm-shell-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytm-shell-windows-x64
          path: |
            dist-win/ytm-shell-setup-x64.exe
            dist-win/ytm-shell-windows-x64-portable.zip
            dist-win/ytm-shell-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ytm-shell-linux-x86_64
          path: artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ytm-shell-windows-x64
          path: artifacts

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v0.1.0' }}
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
