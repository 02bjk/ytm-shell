[package]
name = "ytm-shell"
version = "0.1.0"
edition = "2021"
authors = ["Senior Security Engineer"]
description = "Hardened desktop shell for YouTube Music"
license = "MIT OR Apache-2.0"
default-run = "ytm-shell"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tauri = { version = "2.12.1", default-features = false, features = ["wry", "tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2.5.2", default-features = false }
tauri-plugin-global-shortcut = { version = "2.2.0", default-features = false }
url = { version = "2.5.8", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
adblock = { version = "0.13.3", default-features = false, features = ["content-blocking", "embedded-domain-resolver"] }


[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", default-features = false, features = ["v2_40"] }
javascriptcore = { version = "1.1.2", default-features = false, package = "javascriptcore-rs" }
gtk = { version = "0.18.2", default-features = false }
glib = { version = "0.18.5", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
tauri-build = { version = "2.7.1", default-features = false, features = ["config-json"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.5"

